name: Windows QA and portable build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify, build, test, publish and WPF smoke
        shell: pwsh
        run: ./harness/scripts/qa.ps1 -Publish -Smoke
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: VoxPet-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
      - name: Upload test results and rendered smoke image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-QA-evidence
          path: |
            artifacts/test-results/
            ${{ runner.temp }}/voxpet-smoke.png
            ${{ runner.temp }}/voxpet-smoke-error.txt
          if-no-files-found: warn
