name: Windows QA and portable build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      personal_sheet_release:
        description: 'Optional temporary draft release containing neulbo-sheet.png for private character QA'
        default: ''
        required: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load optional private character QA fixture
        if: github.event_name == 'workflow_dispatch' && inputs.personal_sheet_release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QA_RELEASE: ${{ inputs.personal_sheet_release }}
        run: |
          if ($env:QA_RELEASE -notmatch '^voxpet-private-qa-[a-z0-9-]+$') { throw 'Invalid QA release name' }
          $draft = gh release view $env:QA_RELEASE --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'QA fixture must be a draft release' }
          gh release download $env:QA_RELEASE --pattern 'neulbo-sheet.png' --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'QA fixture download failed' }
          Move-Item "$env:RUNNER_TEMP/neulbo-sheet.png" "$env:RUNNER_TEMP/늘보군.png"
          "VOXPET_QA_SHEET=$env:RUNNER_TEMP/늘보군.png" >> $env:GITHUB_ENV
      - name: Verify, build, test, publish and WPF smoke
        shell: pwsh
        run: ./harness/scripts/qa.ps1 -Publish -Smoke
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: VoxPet-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
      - name: Upload test results and rendered smoke image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-QA-evidence
          path: |
            artifacts/test-results/
            ${{ runner.temp }}/voxpet-smoke.png
            ${{ runner.temp }}/voxpet-smoke-error.txt
            ${{ runner.temp }}/voxpet-smoke-result.json
            ${{ runner.temp }}/voxpet-layout-*.png
            ${{ runner.temp }}/voxpet-layout-result.json
            ${{ runner.temp }}/voxpet-personal-*.png
          if-no-files-found: warn
